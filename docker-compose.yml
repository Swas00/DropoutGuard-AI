services:
  # ----------------------------------------------------
  # 1. MongoDB Database Container
  # ----------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: dropoutguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dropoutguard-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------
  # 2. Machine Learning FastAPI Microservice
  # ----------------------------------------------------
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: dropoutguard-ml
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
    networks:
      - dropoutguard-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/metrics || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------
  # 3. Enterprise Node.js Backend API
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropoutguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-dropoutguard-secure-enterprise-jwt-key-2026-prod}
      - ML_API_URL=http://ml:5001
      - MONGODB_URI=mongodb://mongo:27017/dropoutguard
      - SKIP_MONGO=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_started
      ml:
        condition: service_started
    networks:
      - dropoutguard-net

  # ----------------------------------------------------
  # 4. Client Frontend (Nginx SPA + Reverse Proxy)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: dropoutguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dropoutguard-net

# ----------------------------------------------------
# Persistent Storage Volumes
# ----------------------------------------------------
volumes:
  mongo-data:
    driver: local

# ----------------------------------------------------
# Private Bridge Network
# ----------------------------------------------------
networks:
  dropoutguard-net:
    driver: bridge
